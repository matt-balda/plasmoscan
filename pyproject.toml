[project]
name = "plasmoscan"
version = "0.1.0"
description = "Leitura assistida por IA para lâminas de malária"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "torch>=2.2",
    "torchvision",
    "ultralytics>=8.2",
]

[tool.uv]
package = false

# Torch CPU-only: o índice padrão do PyPI traz build com CUDA (vários GB)
# mesmo sem GPU disponível, o que deixa o ambiente enorme e a resolução/
# instalação lentas à toa.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
